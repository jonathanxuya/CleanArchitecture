name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        shell: pwsh
        run: dotnet sonarscanner begin /k:"jonathanxuya_CleanArchitecture" /o:"jonathanxuya" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore Clean.Architecture.slnx -p:WarningsNotAsErrors=NU1903

      - name: Build
        shell: pwsh
        run: dotnet build Clean.Architecture.slnx --no-restore --no-incremental -p:WarningsNotAsErrors=NU1903

      - name: End SonarQube analysis
        if: always()
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

